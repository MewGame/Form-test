<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Formulaire Test</title>
        <meta type="description" content="Test Formulaire">
        <link rel="stylesheet" href="style.css" type="text/css">
    </head>

    <body>
        <div class="container">
            <h1>Formulaire Test</h1>

            <form id="main-form" action="#" method="GET">
                <label for="Name">Nom</label>
                <input type="text" id="Name" name="Name" required pattern="[A-Za-zÀ-ÿ '-]{2,50}" title="Lettres, espaces, apostrophes et traits d'union seulement">
                <label for="firstname">Prénom</label>
                <input type="text" id="firstname" name="firstname" required pattern="[A-Za-zÀ-ÿ '-]{2,50}" title="Lettres, espaces, apostrophes et traits d'union seulement">
                <label for="company">Entreprise</label>
                <input type="text" id="company" name="company" pattern="[A-Za-zÀ-ÿ0-9 '&-]{2,80}" title="Lettres, chiffres, espaces, apostrophes et traits d'union">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required title="Entrez une adresse email valide">
        <label for="phone">Numéro de téléphone</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{9,15}" title="Entrez uniquement des chiffres (9 à 15 chiffres)">

        <label for="categorie">Choisissez une catégorie</label>
            <select name="Catégorie" id="categorie" required>
            <option value="">Veuillez choisir une catégorie</option>
            <option value="generique">Générique</option>
            <option value="alerte cyber">ALERTE CYBER</option>
            <option value="anti-virus">Anti-Virus</option>
            <option value="fichiers">Fichiers</option>
            <option value="VPN">VPN</option>
            <option value="Signatures">Signatures</option>
            <option value="lm1">Logiciel métier 1</option>
            <option value="lm2">Logiciel métier 2</option>
        </select>

        <div id="second-form">
            <label for="subcategorie">Choix associés</label>
            <select name="Subcategorie" id="subcategorie">
                <option value="">Sélectionnez une option</option>
            </select>
            <p class="notice">Ce choix apparaît après votre sélection de catégorie.</p>
        </div>

        <label for="message">Commentaire</label>
        <textarea id="message" name="message" rows="4" cols="50"></textarea>

        <button type="submit">Envoyer</button>
            </form>
        </div>
        <script>
            const categorySelect = document.getElementById('categorie');
            const secondForm = document.getElementById('second-form');
            const subcategorySelect = document.getElementById('subcategorie');

            const optionsByCategory = {
                generique: [
                    {value: 'question', text: 'Question générale'},
                    {value: 'demande', text: 'Demande d\'information'},
                    {value: 'suggestion', text: 'Suggestion d\'amélioration'}
                ],
                'alerte cyber': [
                    {value: 'phishing', text: 'Phishing / hameçonnage'},
                    {value: 'ddos', text: 'Attaque DDoS'},
                    {value: 'malware', text: 'Malware / virus'},
                    {value: 'ransomware', text: 'Ransomware'},
                    {value: 'intrusion', text: 'Intrusion ou accès non autorisé'}
                ],
                'anti-virus': [
                    {value: 'installation', text: 'Installation anti-virus'},
                    {value: 'mise-a-jour', text: 'Mise à jour des signatures'},
                    {value: 'bloque', text: 'Scan bloqué ou fichier bloqué'},
                    {value: 'licence', text: 'Problème de licence'},
                    {value: 'performance', text: 'Antivirus lent ou consommant trop'}
                ],
                fichiers: [
                    {value: 'perte', text: 'Fichier perdu'},
                    {value: 'acces', text: 'Problème d\'accès'},
                    {value: 'corruption', text: 'Fichier corrompu'},
                    {value: 'sauvegarde', text: 'Demande de sauvegarde'},
                    {value: 'partage', text: 'Problème de partage de fichier'}
                ],
                VPN: [
                    {value: 'connexion', text: 'Impossible de se connecter'},
                    {value: 'deconnexion', text: 'Déconnexion fréquente'},
                    {value: 'configuration', text: 'Problème de configuration'},
                    {value: 'lenteur', text: 'VPN trop lent'},
                    {value: 'acces-distant', text: 'Accès distant indisponible'}
                ],
                Signatures: [
                    {value: 'mise-a-jour', text: 'Mise à jour des signatures'},
                    {value: 'anomalie', text: 'Anomalie de signature'},
                    {value: 'erreur', text: 'Erreur de signature'},
                    {value: 'synchronisation', text: 'Problème de synchronisation'}
                ],
                lm1: [
                    {value: 'bug', text: 'Bug logiciel métier 1'},
                    {value: 'formation', text: 'Demande de formation'},
                    {value: 'acces', text: 'Problème d\'accès au logiciel'}
                ],
                lm2: [
                    {value: 'bug', text: 'Bug logiciel métier 2'},
                    {value: 'integration', text: 'Problème d\'intégration'},
                    {value: 'performance', text: 'Problème de performance'}
                ]
            };

            const messageTemplates = {
                generique: {
                    question: 'Bonjour,\n\nJ\'aurais besoin de quelques informations complémentaires concernant votre service.\n\nMerci de votre aide.\n\nCordialement.',
                    demande: 'Bonjour,\n\nPourriez-vous me transmettre plus de détails ou une documentation adaptée à ma demande ?\n\nMerci de votre aide.\n\nCordialement.',
                    suggestion: 'Bonjour,\n\nJ\'aimerais vous soumettre une suggestion d\'amélioration pour votre organisation.\n\nMerci de considérer cette proposition.\n\nCordialement.'
                },
                'alerte cyber': {
                    phishing: 'Bonjour,\n\nJ\'ai reçu un e-mail suspect de type phishing. Pourriez-vous vérifier et me conseiller sur les actions à mener ?\n\nMerci de votre réactivité.\n\nCordialement.',
                    ddos: 'Bonjour,\n\nNous suspectons une attaque de type DDoS. Pourriez-vous intervenir rapidement pour sécuriser notre infrastructure ?\n\nMerci de votre aide.\n\nCordialement.',
                    malware: 'Bonjour,\n\nUn poste semble infecté par un malware. Pourriez-vous nous conseiller sur la mise en quarantaine et le nettoyage ?\n\nMerci d\'avance.\n\nCordialement.',
                    ransomware: 'Bonjour,\n\nJe suspecte une infection ransomware. Pourriez-vous vérifier immédiatement et m\'aider à mettre en place les procédures d\'urgence ?\n\nMerci de votre réactivité.\n\nCordialement.',
                    intrusion: 'Bonjour,\n\nUne intrusion ou un accès non autorisé a été détecté. Pourriez-vous effectuer une analyse de sécurité et bloquer l\'incident ?\n\nMerci d\'intervenir rapidement.\n\nCordialement.'
                },
                'anti-virus': {
                    installation: 'Bonjour,\n\nJe rencontre une difficulté lors de l\'installation de l\'antivirus. Pourriez-vous me guider à travers cette procédure ?\n\nMerci de votre aide.\n\nCordialement.',
                    'mise-a-jour': 'Bonjour,\n\nJe souhaite vérifier que les signatures antivirus sont correctement à jour. Pourriez-vous contrôler cela et résoudre tout problème potentiel ?\n\nMerci d\'avance.\n\nCordialement.',
                    bloque: 'Bonjour,\n\nLe scan antivirus est bloqué ou un fichier est incorrectement détecté. Pourriez-vous m\'aider à résoudre cela ?\n\nMerci de votre aide.\n\nCordialement.',
                    licence: 'Bonjour,\n\nJe rencontre un problème avec la licence de l\'antivirus. Pourriez-vous vérifier mon statut de licence et mon contrat ?\n\nMerci de votre aide.\n\nCordialement.',
                    performance: 'Bonjour,\n\nL\'antivirus semble ralentir considérablement le poste. Pourriez-vous contrôler la configuration et l\'optimiser ?\n\nMerci d\'avance.\n\nCordialement.'
                },
                fichiers: {
                    perte: 'Bonjour,\n\nJ\'ai perdu un fichier important. Pourriez-vous m\'aider à le localiser ou à le récupérer ?\n\nMerci de votre aide.\n\nCordialement.',
                    acces: 'Bonjour,\n\nJe n\'ai plus accès à un fichier ou un dossier partagé. Pourriez-vous rétablir l\'accès pour moi ?\n\nMerci d\'avance.\n\nCordialement.',
                    corruption: 'Bonjour,\n\nUn fichier semble corrompu et je ne peux plus y accéder. Pourriez-vous proposer une procédure de réparation ?\n\nMerci de votre aide.\n\nCordialement.',
                    sauvegarde: 'Bonjour,\n\nJ\'aimerais mettre en place une sauvegarde ou restaurer des données existantes. Pourriez-vous m\'aider à organiser cela ?\n\nMerci d\'avance.\n\nCordialement.',
                    partage: 'Bonjour,\n\nJe rencontre un problème lors du partage de fichiers entre utilisateurs. Pourriez-vous identifier et résoudre le dysfonctionnement ?\n\nMerci de votre aide.\n\nCordialement.'
                },
                VPN: {
                    connexion: 'Bonjour,\n\nJe n\'arrive pas à me connecter au VPN. Pourriez-vous vérifier ma configuration et m\'aider à résoudre ce problème ?\n\nMerci de votre aide.\n\nCordialement.',
                    deconnexion: 'Bonjour,\n\nJe me déconnecte fréquemment du VPN. Pourriez-vous identifier la cause et m\'aider à stabiliser la connexion ?\n\nMerci d\'avance.\n\nCordialement.',
                    configuration: 'Bonjour,\n\nLe VPN semble mal configuré de mon côté. Pourriez-vous vérifier les paramètres et la compatibilité ?\n\nMerci de votre aide.\n\nCordialement.',
                    lenteur: 'Bonjour,\n\nMa connexion VPN est très lente. Pourriez-vous vérifier les performances et m\'aider à optimiser cela ?\n\nMerci d\'avance.\n\nCordialement.',
                    'acces-distant': 'Bonjour,\n\nJe ne peux pas accéder aux ressources distantes via le VPN. Pourriez-vous vérifier et rétablir l\'accès ?\n\nMerci de votre aide.\n\nCordialement.'
                },
                Signatures: {
                    'mise-a-jour': 'Bonjour,\n\nPourrais-je vérifier que les signatures sont bien à jour ? Pourriez-vous contrôler cela et me confirmer l\'état ?\n\nMerci d\'avance.\n\nCordialement.',
                    anomalie: 'Bonjour,\n\nUne anomalie de signature a été détectée. Pourriez-vous vérifier et corriger cela ?\n\nMerci de votre aide.\n\nCordialement.',
                    erreur: 'Bonjour,\n\nUne erreur de signature a été signalée sur un poste. Pourriez-vous intervenir rapidement ?\n\nMerci d\'avance.\n\nCordialement.',
                    synchronisation: 'Bonjour,\n\nLa synchronisation des signatures ne fonctionne plus. Pourriez-vous rétablir le service ?\n\nMerci de votre aide.\n\nCordialement.'
                },
                lm1: {
                    bug: 'Bonjour,\n\nJe rencontre un bug sur le logiciel métier 1. Pourriez-vous traiter ce dysfonctionnement ?\n\nMerci d\'avance.\n\nCordialement.',
                    formation: 'Bonjour,\n\nJ\'aimerais suivre une formation sur le logiciel métier 1. Pourriez-vous proposer des créneaux disponibles ?\n\nMerci d\'avance.\n\nCordialement.',
                    acces: 'Bonjour,\n\nJe n\'ai plus accès au logiciel métier 1. Pourriez-vous vérifier mon profil et mes droits d\'accès ?\n\nMerci de votre aide.\n\nCordialement.'
                },
                lm2: {
                    bug: 'Bonjour,\n\nJe rencontre un bug sur le logiciel métier 2. Pourriez-vous corriger cette anomalie ?\n\nMerci d\'avance.\n\nCordialement.',
                    integration: 'Bonjour,\n\nJe rencontre un problème d\'intégration entre le logiciel métier 2 et un autre service. Pourriez-vous vérifier cela ?\n\nMerci de votre aide.\n\nCordialement.',
                    performance: 'Bonjour,\n\nLe logiciel métier 2 est très lent en ce moment. Pourriez-vous vérifier les performances ?\n\nMerci d\'avance.\n\nCordialement.'
                }
            };

            let currentAutoTemplate = '';
            const messageInput = document.getElementById('message');

            categorySelect.addEventListener('change', () => {
                const selected = categorySelect.value;
                const options = optionsByCategory[selected] || [];

                subcategorySelect.innerHTML = '<option value="">Sélectionnez une option</option>';

                if (options.length > 0) {
                    options.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.value;
                        option.textContent = item.text;
                        subcategorySelect.appendChild(option);
                    });
                    secondForm.classList.add('visible');
                } else {
                    secondForm.classList.remove('visible');
                }

                if (!messageInput.value || messageInput.value === currentAutoTemplate) {
                    messageInput.value = '';
                    currentAutoTemplate = '';
                }
            });

            subcategorySelect.addEventListener('change', () => {
                const category = categorySelect.value;
                const subCategory = subcategorySelect.value;
                const template = messageTemplates[category]?.[subCategory] || '';

                if (template && (!messageInput.value || messageInput.value === currentAutoTemplate)) {
                    messageInput.value = template;
                    currentAutoTemplate = template;
                }
            });

            const form = document.getElementById('main-form');
            const sendToEmail = 'assistance@network-systems.fr'; // adresse de destination prédéfinie
            const namePattern = /^[A-Za-zÀ-ÖØ-öø-ÿ' -]{2,50}$/;
            // Phone validation: accept digits only (spaces/punctuation ignored); check digit count 9-15

            form.addEventListener('submit', (event) => {
                event.preventDefault();

                const name = document.getElementById('Name');
                const firstname = document.getElementById('firstname');
                const company = document.getElementById('company').value.trim();
                const email = document.getElementById('email');
                const phone = document.getElementById('phone');
                const category = categorySelect.value;
                const subCategory = subcategorySelect.value;
                const message = document.getElementById('message').value.trim();

                if (!namePattern.test(name.value.trim())) {
                    name.setCustomValidity('Le nom doit contenir uniquement des lettres, espaces, apostrophes ou traits d\'union.');
                    name.reportValidity();
                    return;
                }
                name.setCustomValidity('');

                if (!namePattern.test(firstname.value.trim())) {
                    firstname.setCustomValidity('Le prénom doit contenir uniquement des lettres, espaces, apostrophes ou traits d\'union.');
                    firstname.reportValidity();
                    return;
                }
                firstname.setCustomValidity('');

                // Normalize phone: keep only digits
                const phoneDigits = phone.value.replace(/\D/g, '');
                if (phone.value.trim() && (phoneDigits.length < 9 || phoneDigits.length > 15)) {
                    phone.setCustomValidity('Le numéro doit contenir uniquement des chiffres (9 à 15 chiffres).');
                    phone.reportValidity();
                    return;
                }
                phone.setCustomValidity('');

                if (!email.checkValidity()) {
                    email.reportValidity();
                    return;
                }

                const subject = encodeURIComponent('Nouveau formulaire : ' + category + ' / ' + subCategory);
                const body = encodeURIComponent(
                    'Nom: ' + name.value.trim() + '\n' +
                    'Prénom: ' + firstname.value.trim() + '\n' +
                    'Entreprise: ' + company + '\n' +
                    'Email: ' + email.value.trim() + '\n' +
                    'Téléphone: ' + phone.value.trim() + '\n' +
                    'Catégorie: ' + category + '\n' +
                    'Choix associé: ' + subCategory + '\n\n' +
                    'Message:\n' + message
                );

                window.location.href = `mailto:${sendToEmail}?subject=${subject}&body=${body}`;
            });
        </script>
    </body>
</html>
